# Retrieval re-sweep over saved embeddings (no encoder retraining).
# Run: python scripts/run_retrieval_eval.py --config configs/retrieval.yaml \
#        --data-dir <parquet dir> --embeddings-dir outputs/<run>/embeddings
#
# 'name' should usually match the contrastive run whose embeddings you reuse,
# OR a new name to keep the re-analysis separate.
name: retrieval_eval
output_dir: outputs
seeds: [0, 1, 2]
# folds_whitelist: [chb01, chb02]

data:
  features_dir: ""        # TODO(dataset) or pass --data-dir
  subject_regex: "^(chb\\d+)"
  window_size_sec: 2.0
  step_size_sec: 1.0
  sampling_rate_hz: 256

preprocessing:
  scaler: standard
  impute_nonfinite: true

# The encoder block is unused here (embeddings are loaded), but sequence_len must
# match how the embeddings were produced.
encoder:
  arch: cnn1d
  embedding_dim: 128
  sequence_len: 1

retrieval:
  head: hybrid
  topk_values: [1, 5, 10, 20, 50]
  decision_k: 10
  similarity: cosine
  rbf_gamma: 1.0
  hybrid_alpha: 0.5
  backend: auto
  normalize_embeddings: true
  max_bank_per_class: null
